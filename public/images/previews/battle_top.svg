<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">戰鬥陀螺抽獎動畫示意圖</title>
  <desc id="desc">藍色、紫色與金色陀螺在圓形競技場中對決，中央出現碰撞火花。</desc>
  <defs>
    <radialGradient id="arena"><stop stop-color="#312151"/><stop offset="1" stop-color="#10121f"/></radialGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="pink" x2="1" y2="1"><stop stop-color="#e9d5ff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <g id="top">
      <path d="M-72 0 0 65 72 0 0-30Z" fill="#080b16"/>
      <path d="m0-58 28 13 31-1 8 27 18 19-18 19-8 27-31-1L0 58l-28-13-31 1-8-27-18-19 18-19 8-27 31 1Z" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
      <circle r="36" fill="#0f172a" stroke="#fff" stroke-opacity=".7" stroke-width="4"/>
      <path d="m0-26 9 17 18 9-18 9L0 26-9 9-26 0l17-9Z" fill="#fff" opacity=".85"/>
      <circle r="10" fill="#fbbf24"/>
    </g>
  </defs>
  <rect width="800" height="450" rx="20" fill="#10121f"/>
  <ellipse cx="400" cy="218" rx="329" ry="158" fill="url(#arena)" stroke="#a855f7" stroke-width="4"/>
  <ellipse cx="400" cy="218" rx="285" ry="132" fill="none" stroke="#c084fc" stroke-opacity=".3" stroke-width="2"/>
  <path d="M115 223c48-103 174-145 296-129M685 223c-40 96-163 133-263 116" fill="none" stroke="#c084fc" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>
  <use href="#top" transform="translate(282 210) rotate(-18)" fill="url(#blue)"/>
  <use href="#top" transform="translate(507 190) rotate(24)" fill="url(#pink)"/>
  <use href="#top" transform="translate(432 290) scale(.65) rotate(-10)" fill="url(#gold)"/>
  <path d="m398 165 9 30 27-13-18 26 28 11-31 2 3 29-17-25-19 20 8-29-29-7 28-8Z" fill="#fef3c7"/>
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round"><path d="m356 174-12-14m101 84 14 13m-17-99 10-11m-98 106-10 13"/></g>
  <text x="400" y="410" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-weight="700" font-size="30">戰鬥陀螺</text>
</svg>
